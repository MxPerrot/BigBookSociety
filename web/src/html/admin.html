<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/admin.css">
    <script src="../js/header.js" defer></script>
    <script src="../js/footer.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Admin</title>
</head>
<body>
    <header-component></header-component>

    <main>
        <div class="stats">
            <h2>Les livres les plus populaires</h2>
            <div id="list_populaires"></div>
            <canvas id="populareChart" width="400" height="400"></canvas>
        </div>
        <div class="stats">
            <h2>Les livres les plus souhaités</h2>
            <div id="list_whish"></div>
            <canvas id="wishChart" width="400" height="400"></canvas>
        </div>
        <div class="ajout_livre">
            <form id="uploadForm" enctype='multipart/form-data'>
                <h2>Ajouter un livre</h2>
                <div class="horizontal">
                    <h3>Titre* : </h3>
                    <input type="text" class="input" name="titre" id="form-titre" required/>
                </div>
                <div class="horizontal">
                    <h3>Auteur : </h3>
                    <input type="text" class="input" name="auteur" id="form-auteur"/>
                </div>
                <div class="horizontal">
                    <h3>Edition* : </h3>
                    <input type="text" class="input" name="edition" id="form-edition" required/>
                </div>
                <div class="horizontal">
                    <h3>Nombre de pages : </h3>
                    <input type="number" class="input" name="nb_pages" id="form-nb_pages"/>
                </div>
                <div class="horizontal">
                    <h3>Date de sortie : </h3>
                    <input type="text" class="input" name="date_sortie" id="form-date_sortie" placeholder="jj/mm/yyyy/" pattern="\d{1,2}/\d{1,2}/\d{4}">
                </div>
                <div class="horizontal">
                    <h3>Description: </h3>
                    <textarea class="input" name="description" rows="5" id="form-description"></textarea>
                </div>
                <div class="horizontal">
                    <h3>ISBN13: </h3>
                    <input type="text" class="input" name="isbn" id="form-isbn" minlength="13" maxlength="13"/>
                </div>
                <div>
                    <img id="preview" preview.onerror="this.onerror=null;this.src='../../public/img/couverture.jpg';">
                </div>
                <div class="validate">
                    <input type="submit" name="valider" id="submit" class="button"></input>
                </div>
            </form>
        </div>
    </main>

    <script src="../js/admin.js" type="module"></script>

    <footer-component></footer-component>
</body>
</html>
