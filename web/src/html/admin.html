<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/admin.css">
    <script src="../js/header.js" defer></script>
    <script src="../js/footer.js" defer></script>
    <title>Admin</title>
</head>
<body>
    <header-component></header-component>

    <main>
        <!--
        Possibilité ajout livre en base
        Liste prédictive des top ventes obtenue grâce à la combinaison des listes de souhaits et des recommandations
            Ordre des ventes achats
            idéalement filtrage
        -->

        <div class="stats">
            <h2>Les livres les plus populaires</h2>
            <div id="list_populaires">
            </div>
        </div>
        <div class="stats">
            <h2>Les livres les plus souhaités</h2>
            <div id="list_whish">
            </div>
        </div>
        <div class="ajout_livre">
            <form action="./truc.html" method="post">
                <h2>Ajouter un livre</h2>
                <div class="horizontal">
                    <h3>Titre : </h3>
                    <input type="text" class="input" name="titre"/>
                </div>
                <div class="horizontal">
                    <h3>Auteur : </h3>
                    <input type="text" class="input" name="auteur"/>
                </div>
                <div class="horizontal">
                    <h3>Edition : </h3>
                    <input type="text" class="input" name="edition"/>
                </div>
                <div class="horizontal">
                    <h3>Nombre de pages : </h3>
                    <input type="number" class="input" name="nb_pages"/>
                </div>
                <div class="horizontal">
                    <h3>Date de sortie : </h3>
                    <input type="text" class="input" name="date_sortie"/>
                </div>
                <div class="horizontal">
                    <h3>Description: </h3>
                    <textarea class="input" name="description"></textarea>
                </div>
                <div class="horizontal">
                    <h3>Couverture: </h3>
                    <input type="file" class="input" name="couverture"/>
                </div>
                <div class="validate">
                    <button type="submit" name="valider" class="button">Valider</button>
                </div>
            </form>
        </div>
    </main>

    <script src="../js/admin.js" type="module"></script>

    <footer-component></footer-component>
</body>
</html>
